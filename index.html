<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INVOISE | PRO VOCAL STUDIO</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --border: #2a2a2a;
            --accent: #76a1f8; /* Gold */
            --accent-hover: #d4af37; 
            --text: #e0e0e0;
            --text-muted: #888;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            text-align: center;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            font-size: 2rem;
        }

        .brand-name-primary { color: #76a1f8; }
        .brand-name-secondary { color: #d4af37; }

        .brand-logo {
            display: block;
            width: min(180px, 60vw);
            height: auto;
            margin: 0 auto 1rem;
        }
        
        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 3rem;
            letter-spacing: 1px;
        }

        /* Drop Zone */
        .drop-zone {
            border: 1px dashed var(--border);
            border-radius: 12px;
            padding: 3rem 1rem;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            background: var(--surface);
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--accent);
            background: #1a1a1a;
        }

        .drop-zone input {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            opacity: 0;
            cursor: pointer;
        }

        .icon-upload { font-size: 2rem; margin-bottom: 1rem; display: block; }
        .file-info { margin-top: 1rem; font-size: 0.85rem; color: var(--accent); display: none; word-break: break-all;}

        /* Controls */
        .controls {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            opacity: 0.5;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .controls.active { opacity: 1; pointer-events: all; }

        button {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 12px 30px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
        }

        button.primary {
            background: var(--accent);
            color: #000;
            font-weight: 600;
        }

        button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2); }
        button.primary:hover:not(:disabled) { background: var(--accent-hover); }
        button:disabled { opacity: 0.3; cursor: not-allowed; transform: none; border-color: #444; color: #666;}

        /* Visualizer & Progress */
        .visualizer-container {
            margin-top: 2rem;
            height: 80px;
            width: 100%;
            background: #0f0f0f;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            display: none;
            border: 1px solid #222;
        }

        canvas { width: 100%; height: 100%; display: block; }

        .progress-bar {
            position: absolute;
            bottom: 0; left: 0;
            height: 3px;
            background: var(--accent);
            width: 0%;
            transition: width 0.1s linear;
            z-index: 10;
        }

        .status-text {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            min-height: 1.2em;
        }

        /* Footer */
        footer {
            position: absolute;
            bottom: 1rem;
            font-size: 0.7rem;
            color: #444;
        }
        
        a { color: inherit; text-decoration: none; border-bottom: 1px dotted #444; }
    </style>
</head>
<body>

<div class="app-container">
    <img class="brand-logo" src="invoise.png" alt="Invoise">
    <h1><span class="brand-name-primary">IN</span><span class="brand-name-secondary">VOISE</span></h1>
    <div class="subtitle">PRO VOCAL STUDIO</div>

    <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept="audio/*">
        <span class="icon-upload">🎙️</span>
        <div>Перетащите WAV/MP3 или кликните</div>
        <div class="file-info" id="fileName"></div>
    </div>

    <div class="controls" id="controls">
        <button id="btnProcess" class="primary">Обработать</button>
        <button id="btnDownload" disabled>Скачать WAV</button>
    </div>

    <div class="visualizer-container" id="vizContainer">
        <canvas id="waveform"></canvas>
        <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <div class="status-text" id="statusText"></div>
</div>

<footer>
    INTELLIGENCE VOCAL PROCESSING
    Local Processing • No Cloud Upload • Export: 96 kHz 32-bit Float WAV
</footer>

<script>
/**
 * INVOISE CORE ENGINE v2.0
 * Fixed Export Format & DSP Chain Optimization
 */

const state = {
    audioBuffer: null,
    processedBuffer: null,
    sourceFileName: '',
    isProcessing: false,
};

// DOM Elements
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileNameEl = document.getElementById('fileName');
const controls = document.getElementById('controls');
const btnProcess = document.getElementById('btnProcess');
const btnDownload = document.getElementById('btnDownload');
const vizContainer = document.getElementById('vizContainer');
const progressBar = document.getElementById('progressBar');
const statusText = document.getElementById('statusText');
const canvas = document.getElementById('waveform');
const canvasCtx = canvas.getContext('2d');

// --- 1. FILE HANDLING ---

['dragenter', 'dragover'].forEach(e => {
    dropZone.addEventListener(e, (ev) => {
        ev.preventDefault();
        dropZone.classList.add('dragover');
    });
});

['dragleave', 'drop'].forEach(e => {
    dropZone.addEventListener(e, (ev) => {
        ev.preventDefault();
        dropZone.classList.remove('dragover');
    });
});

dropZone.addEventListener('drop', (e) => handleFile(e.dataTransfer.files[0]));
fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

async function handleFile(file) {
    if (!file || !file.type.startsWith('audio/')) {
        alert('Пожалуйста, загрузите аудиофайл');
        return;
    }

    state.sourceFileName = file.name.replace(/\.[^/.]+$/, '');
    fileNameEl.textContent = `${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
    fileNameEl.style.display = 'block';
    statusText.textContent = 'Декодирование аудио...';
    progressBar.style.width = '0%';
    
    try {
        const arrayBuffer = await file.arrayBuffer();
        // Use AudioContext for decoding only
        const decodeCtx = new (window.AudioContext || window.webkitAudioContext)();
        state.audioBuffer = await decodeCtx.decodeAudioData(arrayBuffer);
        decodeCtx.close();
        
        controls.classList.add('active');
        btnDownload.disabled = true;
        state.processedBuffer = null;
        statusText.textContent = 'Готов к обработке';
        drawWaveform(state.audioBuffer, '#d4af37');
        vizContainer.style.display = 'block';
    } catch (err) {
        console.error(err);
        statusText.textContent = 'Ошибка чтения файла. Попробуйте другой.';
    }
}

// --- 2. DSP CHAIN (ORBIT 7.1) ---

async function processAudio() {
    if (!state.audioBuffer || state.isProcessing) return;
    
    state.isProcessing = true;
    btnProcess.disabled = true;
    btnDownload.disabled = true;
    statusText.textContent = 'Рендеринг студии...';
    progressBar.style.width = '0%';

    const sampleRate = state.audioBuffer.sampleRate;
    const length = state.audioBuffer.length;

    try {
        const renderedBuffer = await renderOrbit71(state.audioBuffer, sampleRate, (progress) => {
            progressBar.style.width = `${progress}%`;
        });
        state.processedBuffer = renderedBuffer;
        
        progressBar.style.width = '100%';
        statusText.textContent = 'Еще один шедевр создан';
        btnDownload.disabled = false;
        
        drawWaveform(renderedBuffer, '#d4af37');
        
    } catch (e) {
        console.error(e);
        statusText.textContent = 'Ошибка рендеринга';
        progressBar.style.width = '0%';
    } finally {
        state.isProcessing = false;
        btnProcess.disabled = false;
    }
}

// --- 3. DSP HELPERS ---

async function renderOrbit71(input, sampleRate, onProgress) {
    const length = input.length;
    const inputLeft = input.getChannelData(0);
    const inputRight = input.numberOfChannels > 1 ? input.getChannelData(1) : inputLeft;
    const mixLeft = new Float32Array(length);
    const mixRight = new Float32Array(length);
    const delaySamples = [8, 6, 7].map(ms => Math.max(1, Math.round(sampleRate * ms / 1000)));
    const velvetTaps = [0.42, -0.31, 0.24, -0.18, 0.13, -0.095, 0.065, -0.04];
    const velvetOffsets = [0.37, 0.89, 1.57, 2.31, 3.19, 4.27, 5.53, 6.91];
    const historySize = Math.max(4096, Math.ceil(sampleRate * 0.02) + 1);
    const histories = [
        new Float32Array(historySize),
        new Float32Array(historySize),
        new Float32Array(historySize)
    ];
    let peak = 0;

    for (let i = 0; i < length; i++) {
        const sourceLeft = inputLeft[i];
        const sourceRight = inputRight[i];
        const mid = (sourceLeft + sourceRight) * 0.5;
        const originalSide = (sourceLeft - sourceRight) * 0.5;

        const sideMode2A = orbitVelvetSide(mid, i, delaySamples[0], histories[0], sampleRate, velvetTaps, velvetOffsets);
        const sideMode1 = orbitHaasSide(mid, i, delaySamples[1], histories[1]);
        const sideMode2B = orbitVelvetSide(mid, i, delaySamples[2], histories[2], sampleRate, velvetTaps, velvetOffsets);

        // Each branch is a complete stereo duplicate, not only a side signal.
        const branchOneSide = originalSide * 2 + sideMode2A * 0.6;
        const branchTwoSide = originalSide * 2 + sideMode1 * 0.6;
        const branchThreeSide = originalSide * 2 + sideMode2B * 0.6;
        const branchOneLeft = mid + branchOneSide;
        const branchOneRight = mid - branchOneSide;
        const branchTwoLeft = mid + branchTwoSide;
        const branchTwoRight = mid - branchTwoSide;
        const branchThreeLeft = mid + branchThreeSide;
        const branchThreeRight = mid - branchThreeSide;

        // True 3-track parallel sum happens before the final limiter.
        const left = branchOneLeft + branchTwoLeft + branchThreeLeft;
        const right = branchOneRight + branchTwoRight + branchThreeRight;
        mixLeft[i] = left;
        mixRight[i] = right;
        peak = Math.max(peak, Math.abs(left), Math.abs(right));

        if ((i & 65535) === 0) {
            onProgress(Math.round(i / length * 90));
            await new Promise(resolve => setTimeout(resolve, 0));
        }
    }

    const ceiling = 0.999;
    const limiterGain = peak > ceiling ? ceiling / peak : 1;
    for (let i = 0; i < length; i++) {
        mixLeft[i] *= limiterGain;
        mixRight[i] *= limiterGain;
    }

    const output = new AudioBuffer({ length, numberOfChannels: 2, sampleRate });
    output.copyToChannel(mixLeft, 0);
    output.copyToChannel(mixRight, 1);
    onProgress(100);
    return output;
}

function orbitHaasSide(mid, index, delaySamples, history) {
    if (index < delaySamples)
        return 0;
    history[index % history.length] = mid;
    return history[(index - delaySamples) % history.length];
}

function orbitVelvetSide(mid, index, baseDelay, history, sampleRate, taps, offsets) {
    history[index % history.length] = mid;
    let side = 0;
    for (let tap = 0; tap < taps.length; tap++) {
        const offset = baseDelay + Math.max(1, Math.round(offsets[tap] * sampleRate / 1000));
        const position = index - offset;
        if (position >= 0)
            side += history[position % history.length] * taps[tap];
    }
    return side;
}

// --- 4. VISUALIZATION ---

function drawWaveform(buffer, color = '#d4af37') {
    // Handle DPI scaling
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    
    canvasCtx.scale(dpr, dpr);
    
    const width = rect.width;
    const height = rect.height;
    const data = buffer.getChannelData(0);
    const step = Math.ceil(data.length / width);
    const amp = height / 2;

    canvasCtx.clearRect(0, 0, width, height);
    canvasCtx.strokeStyle = color;
    canvasCtx.lineWidth = 1.5;
    canvasCtx.beginPath();

    for (let i = 0; i < width; i++) {
        let min = 1.0, max = -1.0;
        const startIdx = i * step;
        const endIdx = Math.min(startIdx + step, data.length);
        
        for (let j = startIdx; j < endIdx; j++) {
            const datum = data[j];
            if (datum < min) min = datum;
            if (datum > max) max = datum;
        }
        
        // Map values to Y coordinates
        const yTop = (1 + min) * amp;
        const yBottom = (1 + max) * amp;
        
        canvasCtx.moveTo(i, yTop);
        canvasCtx.lineTo(i, yBottom);
    }
    canvasCtx.stroke();
}

// --- 5. EXPORT (WAV ENCODER - FIXED FOR COMPATIBILITY) ---

btnProcess.addEventListener('click', processAudio);

btnDownload.addEventListener('click', () => {
    if (!state.processedBuffer) return;
    statusText.textContent = 'Подготовка файла...';
    
    // Small timeout to allow UI update before heavy computation
    setTimeout(async () => {
        const exportBuffer = await resampleAudioBuffer(state.processedBuffer, 96000);
        const wavBlob = encodeWAV(exportBuffer);
        const url = URL.createObjectURL(wavBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${state.sourceFileName}_invoise.wav`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        statusText.textContent = 'Файл скачан.';
    }, 10);
});

/**
 * Encodes AudioBuffer to 32-bit IEEE float WAV Blob.
 */
function encodeWAV(audioBuffer) {
    const numChannels = audioBuffer.numberOfChannels;
    const sampleRate = audioBuffer.sampleRate;
     const format = 3; // IEEE floating point
     const bitDepth = 32;
    
    const bytesPerSample = bitDepth / 8;
    const blockAlign = numChannels * bytesPerSample;
    const dataSize = audioBuffer.length * blockAlign;
    const headerSize = 44;
    const totalSize = headerSize + dataSize;
    
    const arrayBuffer = new ArrayBuffer(totalSize);
    const view = new DataView(arrayBuffer);

    // --- Write Header ---
    writeString(view, 0, 'RIFF');
    view.setUint32(4, totalSize - 8, true); // ChunkSize
    writeString(view, 8, 'WAVE');
    writeString(view, 12, 'fmt ');
    view.setUint32(16, 16, true); // Subchunk1Size (16 for PCM)
    view.setUint16(20, format, true); // AudioFormat (1 = PCM)
    view.setUint16(22, numChannels, true); // NumChannels
    view.setUint32(24, sampleRate, true); // SampleRate
    view.setUint32(28, sampleRate * blockAlign, true); // ByteRate
    view.setUint16(32, blockAlign, true); // BlockAlign
    view.setUint16(34, bitDepth, true); // BitsPerSample
    writeString(view, 36, 'data');
    view.setUint32(40, dataSize, true); // Subchunk2Size

    // --- Write Data ---
    let offset = 44;
    const channels = [];
    for (let i = 0; i < numChannels; i++) {
        channels.push(audioBuffer.getChannelData(i));
    }

    for (let i = 0; i < audioBuffer.length; i++) {
        for (let ch = 0; ch < numChannels; ch++) {
            // Get float sample (-1.0 to 1.0)
            let sample = channels[ch][i];
            
            // Clamp to prevent distortion if values exceed range due to effects
            if (sample > 1.0) sample = 1.0;
            else if (sample < -1.0) sample = -1.0;
            
            view.setFloat32(offset, sample, true); // Little Endian
            offset += 4;
        }
    }

    return new Blob([arrayBuffer], { type: 'audio/wav' });
}

async function resampleAudioBuffer(audioBuffer, targetSampleRate) {
    if (audioBuffer.sampleRate === targetSampleRate) return audioBuffer;

    const OfflineContext = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const targetLength = Math.ceil(audioBuffer.duration * targetSampleRate);
    const offlineContext = new OfflineContext(audioBuffer.numberOfChannels, targetLength, targetSampleRate);
    const source = offlineContext.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(offlineContext.destination);
    source.start();
    return offlineContext.startRendering();
}

function writeString(view, offset, string) {
    for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
    }
}

// Init resize handler for canvas
window.addEventListener('resize', () => {
    if(state.processedBuffer) drawWaveform(state.processedBuffer, '#d4af37');
    else if(state.audioBuffer) drawWaveform(state.audioBuffer, '#d4af37');
});

</script>
</body>
</html>
